name: ESP-IDF 6.0 — интегрированный контроллер коммутатора

on:
  push:
    branches:
      - feature/switchboard-controller
    paths:
      - "examples/19_switchboard_controller/**"
      - "examples/17_tle94112_chaser_test/components/**"
      - "bsp/levisw-mb-v1.2/**"
      - "components/**"
      - ".github/workflows/switchboard-controller-idf-build.yml"
  pull_request:
    paths:
      - "examples/19_switchboard_controller/**"
      - "examples/17_tle94112_chaser_test/components/**"
      - "bsp/levisw-mb-v1.2/**"
      - "components/**"
      - ".github/workflows/switchboard-controller-idf-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Сборка безопасной конфигурации для ESP32
    runs-on: ubuntu-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Собрать Example 19 на ESP-IDF 6.0
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: release-v6.0
          target: esp32
          path: examples/19_switchboard_controller
